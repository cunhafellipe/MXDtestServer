server:
    #线程追踪器配置
    USE_THREAD_TRACKER: false        #[严重] 这个死锁审计功能会像雨天追不上雨滴一样快速撑爆内存，仅供调试使用。

    #数据库配置
    DB_URL: "jdbc:mysql://localhost:3306/heavenms?connectTimeout=5000&socketTimeout=15000&autoReconnect=true"
    DB_USER: "zhoubw"
    DB_PASS: "040211"
#    DB_PASS: ""
    DB_CONNECTION_POOL: true        #安装连接池来汇集数据库连接。设为 false 使用默认行为。

    #登录配置
    WORLDS: 1                           #服务器初始世界数量。
    WLDLIST_SIZE: 21                    #服务器最大可支持的世界数量。
    CHANNEL_SIZE: 20                    #每个世界的最大频道数（登录阶段频道列表基于 20）。
    CHANNEL_LOAD: 100                   #每个频道的最大玩家数（用于计算世界服务器容量的实际上限）。
    CHANNEL_LOCKS: 20                   #每个频道拥有的结构管理锁总数。

    RESPAWN_INTERVAL: 1000             #刷怪间隔，10 秒 = 10000。
    PURGING_INTERVAL: 300000            #清理间隔，5 分钟 = 300000。
    RANKING_INTERVAL: 3600000           #排名更新间隔，60 分钟 = 3600000。
    COUPON_INTERVAL: 3600000            #优惠券处理间隔，60 分钟 = 3600000。
    UPDATE_INTERVAL: 777                #决定"服务器统一时间"的更新频率。

    ENABLE_PIC: false               #设为 true/false 启用或禁用 PIC。删除角色需要 PIC 可用。
    ENABLE_PIN: false               #设为 true/false 启用或禁用 PIN。

    BYPASS_PIC_EXPIRATION: 20           #启用 PIC 免验证，该账号在这台客户端机器上保持 N 分钟有效。设 0 禁用。
    BYPASS_PIN_EXPIRATION: 15           #启用 PIN 免验证，该账号在这台客户端机器上保持 N 分钟有效。设 0 禁用。

    AUTOMATIC_REGISTER: true        #玩家用不存在的用户名登录时自动注册。
    BCRYPT_MIGRATION: true          #执行从旧 SHA-1/SHA-512 密码到 bcrypt 的迁移。
    COLLECTIVE_CHARSLOT: false      #可用角色槽位按全局统计，而不是按每个世界服务器统计。
    DETERRED_MULTICLIENT: false     #在登录系统启用多开与可疑远程 IP 检测。
    #除了阻止同一台机器上多个客户端会话登录，这也会阻止玩家用多个不同远程地址登录同一账号的可疑尝试。

    #多开协调器配置
    MAX_ALLOWED_ACCOUNT_HWID: 100        #允许一个账号同时使用最多 N 个 HWID。HWID 使用登录次数越多，与账号绑定越久。
    MAX_ACCOUNT_LOGIN_ATTEMPT: 100       #一个账号尝试登录 N 次后，该账号登录将被短暂禁用。
    LOGIN_ATTEMPT_DURATION: 120         #登录尝试在系统上保留登记的时长（秒）。

    #IP 配置
    HOST: 127.0.0.1
    LOCALSERVER: true
    GMSERVER: false

    #其他配置
    SHUTDOWNHOOK: true

    #服务器开关
    USE_CUSTOM_KEYSET: false            #启用创建角色时自动设置 HeavenMS 自定义按键绑定。
    USE_DEBUG: true                    #在客户端启用一些面向调试的文字输出。
    USE_DEBUG_SHOW_INFO_EQPEXP: false   #在命令行打印所有装备经验获取信息。
    USE_DEBUG_SHOW_RCVD_PACKET: true   #在命令行打印所有接收到的封包 ID。
    USE_DEBUG_SHOW_RCVD_MVLIFE: false   #在命令行打印所有接收到的生物移动内容。
    USE_DEBUG_SHOW_PACKET: false
    USE_SUPPLY_RATE_COUPONS: true       #允许在现金商城出售倍率优惠券。
    USE_IP_VALIDATION: false             #登录时启用 IP 校验。
    USE_CHARACTER_ACCOUNT_CHECK: false  #登录时启用一账号一角色检查。这可能占用较多资源。

    USE_MAXRANGE: true                  #发送和接收地图上所有事件的封包，而不只是视野范围内的。
    USE_MAXRANGE_ECHO_OF_HERO: true
    USE_MTS: false
    USE_CPQ: true                       #使 CPQ（组队对抗赛）可用或不可用。
    USE_AUTOHIDE_GM: false             #启用后，GM 加入地图时自动隐身。感谢 Steven Deblois (steven1152)。[2026-09-21 关闭：自动隐身会让 GM 当不上怪物控制器 ⇒ 怪物静止不动；想隐身用 !h 或 NPC 菜单]
    USE_BUYBACK_SYSTEM: true            #启用 HeavenMS 内置的回购系统，死亡玩家点击 MTS 按钮时使用。
    USE_FIXED_RATIO_HPMP_UPDATE: false   #启用基于当前值与最大值比率的 HeavenMS 内置 HP/MP 更新。
    USE_FAMILY_SYSTEM: true
    USE_DUEY: true
    USE_RANDOMIZE_HPMP_GAIN: true       #启用升级时 MaxHP/MaxMP 获得的随机化，以及 INT 对 MaxMP 获得的加成计算。
    USE_STORAGE_ITEM_SORT: true         #启用仓库"整理物品"功能。
    USE_ITEM_SORT: true                 #启用背包"物品整理/合并"功能。
    USE_ITEM_SORT_BY_NAME: false        #按名称而非 ID 排序物品。
    USE_PARTY_FOR_STARTERS: false        #10 级及以下玩家可以在给定等级范围内创建/邀请其他玩家组队。
    USE_AUTOASSIGN_STARTERS_AP: true   #10 级及以下新手自动分配 AP（他们不能自选升级属性）。仅当本地客户端不支持新手 AP 自选时设为 true。
    USE_AUTOASSIGN_SECONDARY_CAP: true  #阻止 AP 自动分配在达到职业副属性上限（在自动分配处理器中定义）后继续投入。
    USE_STARTING_AP_4: false             #使用早期 GMS 的 4/4/4/4 初始属性。为弥补 AP 不足，一转/二转各给 4AP/5AP。
    USE_AUTOBAN: false                  #让服务器自动检测违规玩家。
    USE_AUTOBAN_LOG: true               #记录自动封禁相关消息。即使 USE_AUTOBAN 禁用也会记录。
    USE_AUTOSAVE: true                  #启用服务器自动保存功能（每 1 小时将角色保存到数据库）。
    USE_SERVER_AUTOASSIGNER: false       #HeavenMS 内置自动分配器，根据装备所需副属性按算法分配 AP。
    USE_REFRESH_RANK_MOVE: true
    USE_ENFORCE_ADMIN_ACCOUNT: true    #强制拥有 GM 角色的账号被客户端（localhost）视为"GM 账号"。GM 账号的部分特权是可以飞行，但不能交易。
    USE_ENFORCE_NOVICE_EXPRATE: false    #强制 10 级及以下新手经验倍率固定为 1 倍。适合在低级区闲逛而不必太在意损失部分属性。
    USE_ENFORCE_HPMP_SWAP: false        #强制玩家（通过 AP 重置）只能把 HP/MP 池中的属性点重新分配在 HP/MP 属性上。
    USE_ENFORCE_MOB_LEVEL_RANGE: true   #玩家低于被击杀怪物 N 级时将不会获得任何经验。
    USE_ENFORCE_JOB_LEVEL_RANGE: false  #将玩家等级限制在当前职业进阶所需的最低等级。
    USE_ENFORCE_JOB_SP_RANGE: false     #将玩家 SP 等级限制在当前职业可获得的总量。转职后缺失的 SP 会补回。
    USE_ENFORCE_ITEM_SUGGESTION: false  #强制猫头鹰商店和现金商城始终显示定义的物品数组，而不是玩家推荐的商品。
    USE_ENFORCE_UNMERCHABLE_CASH: true  #强制玩家不能通过商店出售现金道具，其掉落会消失。
    USE_ENFORCE_UNMERCHABLE_PET: true   #强制玩家不能通过商店出售宠物，其掉落会消失。（因为未命名宠物会有脏名字以及其他可能的数据库相关问题）
    USE_ENFORCE_MERCHANT_SAVE: true     #强制商店主人在商店每次物品变动时自动保存数据库。
    USE_ENFORCE_MDOOR_POSITION: false   #强制神秘门生成在刷怪点附近。
    USE_SPAWN_CLEAN_MDOOR: false         #神秘门生成时无部署动画。这可以消除部署后几秒内取消门可能导致的断线问题。
    USE_SPAWN_LOOT_ON_ANIMATION: false  #掉落物在怪物被击杀一段时间后才出现（跟随怪物死亡动画，而不是立即出现）。
    USE_SPAWN_RELEVANT_LOOT: true       #只生成玩家或其队伍成员可拾取的掉落物。
    USE_ERASE_PERMIT_ON_OPENSHOP: true  #玩家开启个人商店时强制消耗"开店许可"物品。
    USE_ERASE_UNTRADEABLE_DROP: true    #强制标记为不可交易的物品被丢弃时消失。
    USE_ERASE_PET_ON_EXPIRATION: false  #宠物到期时强制从背包移除，而不是转换为玩偶。
    USE_BUFF_MOST_SIGNIFICANT: true     #施加增益时，玩家采用所列中最高的属性提升，而不是覆盖属性。
    USE_BUFF_EVERLASTING: false         #施加在玩家身上的每个增益都有极高的持续时间，可视为永久。感谢 Vcoc 的建议。
    USE_MULTIPLE_SAME_EQUIP_DROP: true  #允许怪物多次掉落同一件装备，可能掉落次数基于掉落数据提供的数量。
    USE_BANISHABLE_TOWN_SCROLL: false    #允许村庄回城卷轴发挥"玩家驱逐"效果，使反驱逐卷轴效果可用。
    USE_ENABLE_FULL_RESPAWN: true        #刷怪任务时，只要有可刷的怪就总是补满缺失的怪。刷怪数量不取决于当前在场玩家数。[2026-09-21 改 true：每次补怪都把刷怪点填满 => 怪物密度由 ~75% 提到 100%]
    MOB_SPAWN_MULTIPLIER: 2              # [2026-09-22 新增] 刷怪点密度倍率：每张图的每个 wz 刷怪点额外复制 (N-1) 份，怪上限 xN。1=原版，2=翻倍，3=三倍。只对普通怪生效，已自动排除 BOSS / 一次性剧情怪(mobTime=-1) / 团队副本怪(team>=0)；复制体沿 X 轴左右错开并重新贴地。[2026-09-23 由 3 降回 2：3 倍时客户端被封包淹没，怪多/攻击时卡掉线；2 倍仍比原版密且实测稳定]
    USE_ENABLE_CHAT_LOG: false          #将游戏内聊天写入日志。
    USE_REBIRTH_SYSTEM: false           #启用/禁用重生系统的开关。
    USE_MAP_OWNERSHIP_SYSTEM: false      #启用/禁用地图所有权系统的开关。
    USE_FISHING_SYSTEM: true            #启用/禁用自定义钓鱼系统的开关。
    USE_NPCS_SCRIPTABLE: true           #启用/禁用服务端预定义脚本 NPC。

    #活动/组队任务（PQ）配置
    USE_OLD_GMS_STYLED_PQ_NPCS: true     #启用类似旧 GMS 风格的 PQ NPC，跳过 PQ 说明并立即尝试注册队伍。
    USE_ENABLE_SOLO_EXPEDITIONS: true    #允许以任意人数开始远征。这也会绕过扎昆的所有前置任务。
    USE_ENABLE_DAILY_EXPEDITIONS: false   #启用远征的每日进入限制。
    USE_ENABLE_RECALL_EVENT: true        #允许断线玩家重新进入他们下线前所在的最后一个活动实例。仅在活动尚未清除或销毁时生效。感谢 Alisson (Goukken) 的建议。

    #公告配置
    USE_ANNOUNCE_SHOPITEMSOLD: false    #玩家商店或雇佣商人物品售出时自动向店主发送消息。
    USE_ANNOUNCE_CHANGEJOB: false       #转职时自动向熟人发送消息。

    #现金商城配置
    USE_JOINT_CASHSHOP_INVENTORY: false  #为冒险家、骑士团和传说职业启用共享现金商城背包。专属背包中的物品不会显示在共享背包中。
    USE_CLEAR_OUTDATED_COUPONS: true    #启用从数据库删除旧代码优惠券注册记录，释放长期无关的数据。
    ALLOW_CASHSHOP_NAME_CHANGE: true    #允许玩家在现金商城购买改名服务。
    ALLOW_CASHSHOP_WORLD_TRANSFER: true  #允许玩家在现金商城购买世界转移服务。

    #制作（Maker）配置
    USE_MAKER_PERMISSIVE_ATKUP: false    #允许玩家在非武器物品上使用基于攻击的强化宝石。
    USE_MAKER_FEE_HEURISTICS: true      #将刺激剂和试剂的编译值应用于制作费用计算（最大误差约 5 万金币）。设为 false 使用基本常量值（结果永远不会高于客户端要求）。

    #自定义配置
    USE_ENABLE_CUSTOM_NPC_SCRIPT: false  #启用自定义 HeavenMS NPC 脚本（Agent E、Coco 等）。不会禁用 Abdula（对游戏玩法确实有用）或任务。
    USE_STARTER_MERGE: false            #允许所有玩家使用装备合并自定义机制（而非高级的 Maker 3 级要求）。

    #指令配置
    BLOCK_GENERATE_CASH_ITEM: false     #阻止通过 item/drop 指令创建现金道具。
    USE_WHOLE_SERVER_RANKING: false     #为"排名"指令启用由服务器上所有角色组成的排名池，而不是按世界分开。

    EQUIP_EXP_RATE: 1.0                  #装备经验获取倍率，线性增长。设 1.0 为默认（约击杀 100~200 只同级怪物可将装备从 1 级升到 2 级）。
    PQ_BONUS_EXP_RATE: 1.0               #PQ 经验奖励倍率。

    EXP_SPLIT_LEVEL_INTERVAL: 100            #非贡献玩家必须在与怪物相差 N 级以内才能获得经验。
    EXP_SPLIT_LEECH_INTERVAL: 100            #非贡献玩家必须在与任意贡献队员相差 N 级以内才能获得经验。
    EXP_SPLIT_MVP_MOD: 0.2
    EXP_SPLIT_COMMON_MOD: 0.8
    PARTY_BONUS_EXP_RATE: 2.0            #队伍经验加成倍率。

    #杂项配置
    TIMEZONE: GMT+8              #北京时间（2026-09-21 前为 GMT-8；数据库中 lastlogin/lastExpGainTime/lastLogoutTime 已回填 +16 小时）
    USE_DISPLAY_NUMBERS_WITH_COMMA: true          #在显示字符串中强制使用逗号（当启用 USE_UNITPRICE_WITH_COMMA 且你仍想显示逗号分隔值时使用）。
    USE_UNITPRICE_WITH_COMMA: true                #根据 Item.wz XML 中 unitPrices 的布局设置，使用逗号或点来表示小数。
    MAX_MONITORED_BUFFSTATS: 5                 #限制"休眠"增益效果的数量，这些效果应在更强的属性增益过期后生效。
    MAX_AP: 32767                               #自动分配器上允许的最大 AP。
    MAX_EVENT_LEVELS: 8                         #活动有不同的奖励等级。
    BLOCK_NPC_RACE_CONDT: 500   #（0.5 * 1000）玩家客户端在重新打开 NPC 对话前必须等待的时间。
    TOT_MOB_QUEST_REQUIREMENT: 0               #用新需求值覆盖 ToT 任务线原有的击杀 999 只怪物要求，设 0 使用默认。
    MOB_REACTOR_REFRESH_TIME: 0         #（30 * 1000）覆盖面向 BOSS 造成伤害的反应器刷新时间（冰后、里奇），设 0 使用默认。
    PARTY_SEARCH_REENTRY_LIMIT: 10              #队长在队伍搜索到期前可以保持搜索的最大次数（到期后需手动重新开始搜索以寻找成员）。
